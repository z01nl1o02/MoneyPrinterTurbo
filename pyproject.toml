# 轻量竖屏成片流水线（源自 MoneyPrinterTurbo 实战精简）
# 环境：uv sync && uv run python videos/<批次>/build.py
[project]
name = "douyin-videokit"
version = "0.1.0"
description = "Edge TTS + 本地素材竖屏成片流水线（抖音）"
requires-python = ">=3.11"
dependencies = [
    "moviepy==2.2.1",
    "edge-tts>=7.3.1",
    "pydub==0.25.1",
    "pillow>=10.0",
]

[tool.uv]
package = false
